<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-label="壹捌捌">
  <defs>
    <!-- 金色渐变（配色与原 logo 一致），略微外扩以覆盖整枚图形 -->
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="-8" y1="-8" x2="80" y2="80">
      <stop offset="0" stop-color="#f7dc9a"/>
      <stop offset="0.45" stop-color="#dfb25c"/>
      <stop offset="1" stop-color="#b77f2c"/>
    </linearGradient>
    <!-- 同一渐变在字形坐标系中的等价定义 -->
    <linearGradient id="goldGlyph" gradientUnits="userSpaceOnUse" x1="-2.26" y1="-24.5" x2="814.3" y2="767.5">
      <stop offset="0" stop-color="#f7dc9a"/>
      <stop offset="0.45" stop-color="#dfb25c"/>
      <stop offset="1" stop-color="#b77f2c"/>
    </linearGradient>
    <clipPath id="inner"><rect x="5.5" y="5.5" width="61" height="61" rx="10.5"/></clipPath>
  </defs>

  <!-- 外框：保持原 logo 的圆角与描边 -->
  <rect x="4" y="4" width="64" height="64" rx="12" fill="none" stroke="url(#gold)" stroke-width="3"/>

  <!-- 字形：按参考图形 1:1 矢量化（坐标 1 单位 = 参考图 1 像素） -->
  <g clip-path="url(#inner)">
    <g transform="translate(-7.75618 -5.27778) scale(0.10777 0.11111)" fill="url(#goldGlyph)">
      <!-- 顶篷 -->
      <path d="M 406 68 L 356 152 C 351 170 347 181 344 192 C 334 202 311 208 280 212 L 532 212 C 501 208 478 202 468 192 C 465 181 461 170 456 152 Z"/>
      <rect x="143" y="161" width="523" height="24" rx="12"/>
      <rect x="184" y="212" width="445" height="23" rx="11.5"/>
      <!-- 展柜 -->
      <path d="M 143 277 A 24 24 0 0 1 167 253 H 197 A 24 24 0 0 1 221 277 V 393 A 12 12 0 0 1 209 405 H 155 A 12 12 0 0 1 143 393 Z"/>
      <path d="M 589 277 A 24 24 0 0 1 613 253 H 643 A 24 24 0 0 1 667 277 V 393 A 12 12 0 0 1 655 405 H 601 A 12 12 0 0 1 589 393 Z"/>
      <rect x="143" y="262" width="523" height="38" rx="12"/>
      <rect x="242" y="329" width="325" height="24" rx="12"/>
      <!-- 底座 -->
      <path fill-rule="evenodd" d="M 274 379 H 302 Q 306 403 334 403 H 476 Q 504 403 508 379 H 537 A 32 32 0 0 1 569 411 V 502 A 32 32 0 0 1 537 534 H 274 A 32 32 0 0 1 242 502 V 411 A 32 32 0 0 1 274 379 Z M 338 429 H 473 A 16 16 0 0 1 489 445 V 492 A 16 16 0 0 1 473 508 H 338 A 16 16 0 0 1 322 492 V 445 A 16 16 0 0 1 338 429 Z"/>
      <!-- 底部波纹 -->
      <path d="M 104 615 V 585 H 216 C 238 585 250 552 283 552 C 318 552 330 585 375 585 H 452 C 466 585 476 552 531 552 C 556 552 560 585 582 585 H 708 V 615 Z"/>
    </g>
  </g>
</svg>
