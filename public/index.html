<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf2ea">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="壹捌捌名酒汇礼品提货，查看礼品与附近提货门店。">
  <meta name="map-referer" content="__MAP_REFERER__">
  __CANONICAL_TAG__
  <title>礼品提货</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo-188.svg">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="brand">
        <img class="brand-logo" src="/assets/logo-188.svg" width="64" height="64" alt="壹捌捌">
        <div class="brand-text">
          <div class="brand-name">壹<span class="brand-bar">｜</span>捌<span class="brand-bar">｜</span>捌</div>
          <div class="brand-sub">壹 捌 捌 （1 8 8）名 酒 汇</div>
        </div>
      </div>

      <h1 class="page-title" data-text="礼品提货"><span>礼品提货</span></h1>

      <div class="hero-art">
        <img src="/assets/hero-gift.png" width="800" height="437" alt="礼盒">
      </div>
    </header>

    <main class="content" id="main" aria-busy="true">
      <section class="gift-section" id="gift-section" aria-labelledby="gift-title" hidden>
        <div class="card-frame">
          <div class="gift-card">
            <div class="gift-card-head" id="gift-title">
              礼品
              <span class="gift-tag" id="gift-tag" hidden></span>
            </div>
            <div class="gift-card-body" id="gift-items"></div>
          </div>
        </div>
      </section>

      <div class="gift-skeleton" id="gift-skeleton">
        <div class="card-frame">
          <div class="skeleton-card">
            <div class="sk sk-head"></div>
            <div class="sk-body">
              <div class="sk sk-thumb"></div>
              <div class="sk-copy">
                <div class="sk sk-line sk-w82"></div>
                <div class="sk sk-line sk-w26"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <section class="stores-section" id="stores-section" aria-labelledby="stores-title">
        <h2 class="section-title" id="stores-title" data-text="提货门店"><span>提货门店</span></h2>

        <p class="location-status" id="location-status" role="status" hidden>
          <span class="status-icon" aria-hidden="true"></span>
          <span id="location-text"></span>
          <button class="text-button" id="relocate" type="button" hidden>重新定位</button>
        </p>

        <div class="store-list" id="store-list"></div>

        <div class="store-skeleton" id="store-skeleton">
          <div class="sk-store"></div>
          <div class="sk-store"></div>
          <div class="sk-store"></div>
        </div>
      </section>

      <div class="state-card" id="error-state" hidden>
        <div class="state-icon" aria-hidden="true">!</div>
        <h2 class="state-title" id="error-title">加载失败</h2>
        <p class="state-detail" id="error-detail"></p>
        <button class="primary-button" id="retry" type="button">重新加载</button>
      </div>

      <noscript>
        <div class="state-card">
          <div class="state-icon" aria-hidden="true">!</div>
          <h2 class="state-title">需要开启 JavaScript</h2>
          <p class="state-detail">请开启浏览器的 JavaScript 后刷新页面，以查看礼品和提货门店。</p>
        </div>
      </noscript>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
